name: CI

on:
  push:
    branches: [main]
    paths: ['apps/argus/**', 'supabase/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
