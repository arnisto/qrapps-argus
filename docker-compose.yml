# Argus — one-command local stack.
#
#   docker compose up
#
# Brings up Postgres, Redis, the API, the workers, and the dashboard.
# All apps hot-reload in dev mode (target=dev). For production builds,
# override target=runtime via docker-compose.prod.yml.

name: argus

services:
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argus} -d ${POSTGRES_DB:-argus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: argus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    container_name: argus-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      # Read-only mount so db:migrate / db:migrate:v02 can read the canonical
      # SQL files without rebuilding the image when they change.
      - ./docker:/app/docker:ro
      - /app/node_modules
      - /app/apps/api/node_modules
    # Linux: needed so /v1/connectors/test can reach the docker host for
    # validating connections to host-local Postgres instances (mirrors the
    # workers service so the test path and the polling path see the same DNS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  workers:
    build:
      context: .
      dockerfile: docker/workers.Dockerfile
      target: dev
    container_name: argus-workers
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus}@postgres:5432/${POSTGRES_DB:-argus}
      REDIS_URL: redis://redis:6379
    # Linux: needed so connectors can resolve `host.docker.internal` to the
    # Docker host (Mac/Windows Desktop adds this automatically). Connectors
    # configured to point at host services use this hostname.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./apps/workers:/app/apps/workers
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/workers/node_modules

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      target: dev
    container_name: argus-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      INTERNAL_API_URL: http://api:4000
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next

volumes:
  postgres_data:
  redis_data:
